[pytest]
testpaths = tests
python_files = test_*.py
# tests/blender/ holds Tier C scripts meant to be run inside real
# Blender, not pytest -- they do a bare `import bpy` at module level and
# would fail collection immediately outside Blender (see
# tests/blender_probe_script.py's docstring for the same reasoning).
norecursedirs = blender
